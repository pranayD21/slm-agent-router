    <div class="app" id="app">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Main menu"><svg class="icon"><use href="#i-menu"/></svg></button>
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="#0b57d0" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <span class="brand-name">SLM Mail</span>
        </div>
        <div class="searchbar" id="searchbar">
          <svg class="icon"><use href="#i-search"/></svg>
          <input id="mail-search" type="search" placeholder="Search mail" autocomplete="off" aria-label="Search mail">
          <button class="icon-btn small hidden" id="search-clear" type="button" aria-label="Clear search"><svg class="icon"><use href="#i-close"/></svg></button>
        </div>
        <div class="topbar-actions">
          <button class="ai-toggle" id="ai-toggle" type="button" aria-label="Toggle agent panel">
            <svg class="icon sparkle"><use href="#i-sparkle"/></svg><span>Ask agents</span>
          </button>
          <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
          <div class="avatar-badge" aria-hidden="true">S</div>
        </div>
      </header>

      <div class="shell">
        <nav class="sidebar" id="sidebar" aria-label="Mailbox navigation">
          <button class="compose-btn" id="compose-btn" type="button">
            <svg class="icon"><use href="#i-edit"/></svg><span>Compose</span>
          </button>
          <div class="nav-list" id="nav-list"></div>
          <div class="nav-section-title">Labels</div>
          <div class="nav-list" id="label-list"></div>
        </nav>
        <div class="scrim hidden" id="scrim"></div>

        <main class="content" id="content">
          <section class="list-pane" id="list-pane" aria-label="Email list">
            <div class="list-toolbar">
              <button class="icon-btn" id="refresh-btn" type="button" aria-label="Refresh"><svg class="icon"><use href="#i-refresh"/></svg></button>
              <span class="list-title" id="list-title">Inbox</span>
              <span class="mail-count" id="mail-count"></span>
            </div>
            <div class="mail-list" id="mail-list" role="list"></div>
          </section>

          <section class="reading-pane" id="reading-pane" aria-label="Email reading pane">
            <div class="email-detail" id="email-detail"></div>
          </section>
        </main>

        <aside class="ai-panel" id="ai-panel" aria-label="Agent assistant panel">
          <header class="ai-header">
            <button class="icon-btn ai-back" id="ai-back" type="button" aria-label="Back to inbox"><svg class="icon"><use href="#i-back"/></svg></button>
            <div class="ai-title">
              <svg class="icon sparkle"><use href="#i-sparkle"/></svg>
              <div>
                <h1>Agents</h1>
                <p id="ai-subtitle">Cascade · OpenAI · Claude</p>
              </div>
            </div>
            <button class="icon-btn ai-close" id="ai-close" type="button" aria-label="Close agent panel"><svg class="icon"><use href="#i-close"/></svg></button>
          </header>
          <div class="chat-scroll" id="chat-scroll">
            <div class="chat-thread" id="chat-thread"></div>
          </div>
          <div class="ai-composer">
            <div class="suggestion-row" id="suggestion-row"></div>
            <div class="ai-inputbar">
              <textarea id="prompt-input" rows="1" placeholder="Ask about your inbox…" aria-label="Prompt"></textarea>
              <button class="send-btn" id="send-btn" type="button" aria-label="Send prompt"><svg class="icon"><use href="#i-send"/></svg></button>
            </div>
            <p class="ai-disclaimer">Agents read a synthetic demo inbox. Compare answers, speed, and cost.</p>
          </div>
        </aside>
      </div>

      <button class="fab" id="fab" type="button" aria-label="Ask agents">
        <svg class="icon sparkle"><use href="#i-sparkle"/></svg><span>Ask agents</span>
      </button>

      <div class="snackbar hidden" id="snackbar" role="status"></div>

      <dialog class="settings-dialog" id="settings-dialog">
        <form method="dialog">
          <h2>Settings</h2>
          <p class="settings-hint">API keys are optional, held in memory only, and sent only with each run. The cascade agent uses the local Ollama model when available.</p>
          <div class="provider-status" id="provider-status"></div>
          <label>OpenAI API key
            <input id="key-openai" type="password" placeholder="sk-…" autocomplete="off">
          </label>
          <label>Anthropic API key
            <input id="key-claude" type="password" placeholder="sk-ant-…" autocomplete="off">
          </label>
          <div class="settings-actions">
            <button value="cancel" class="text-btn" type="submit">Cancel</button>
            <button value="save" class="filled-btn" id="settings-save" type="submit">Save</button>
          </div>
        </form>
      </dialog>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
