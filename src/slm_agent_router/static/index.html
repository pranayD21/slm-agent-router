<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SLM Cascade Inbox Manager</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="gmail-app">
      <header class="gmail-topbar">
        <div class="gmail-brand">
          <div class="brand-mark" aria-hidden="true">SLM</div>
          <div>
            <p class="eyebrow">Inbox manager</p>
            <h1>Mail Agent Workspace</h1>
          </div>
        </div>
        <label class="gmail-search">
          <span>Search mailbox</span>
          <input id="mail-search" type="search" placeholder="Search mail">
        </label>
        <div class="run-total" id="run-total">30 messages</div>
      </header>

      <section class="gmail-main">
        <aside class="gmail-sidebar" aria-label="Mailbox navigation">
          <button class="compose-button" type="button">Compose</button>
          <div class="gmail-sidebar-block">
            <p class="eyebrow">Labels</p>
            <div class="mail-filters" id="mail-filters" aria-label="Inbox filters"></div>
          </div>
          <div class="gmail-sidebar-block">
            <div class="sidebar-head">
              <p class="eyebrow">Mailbox</p>
              <button id="reset-view" type="button">Reset</button>
            </div>
            <div class="inbox-metrics" id="inbox-metrics" aria-label="Mailbox metrics"></div>
          </div>
        </aside>

        <section class="mail-workspace" aria-label="Synthetic inbox">
          <section class="mail-list-panel" aria-label="Email list">
            <div class="mail-list-toolbar">
              <div>
                <p class="eyebrow">Executive inbox</p>
                <h2>Inbox</h2>
              </div>
              <span id="mail-count">Loading</span>
            </div>
            <div class="mail-list" id="mail-list"></div>
          </section>

          <section class="reading-pane" aria-label="Selected email">
            <section class="email-detail" id="email-detail"></section>
          </section>
        </section>

        <aside class="assistant-dock" aria-label="Agent chat prompting">
          <section class="composer-panel" aria-label="Agent chat prompt">
            <div class="composer-head">
              <div>
                <p class="eyebrow">Agent chat</p>
                <h2>Ask the inbox agents</h2>
              </div>
              <div class="agent-key">
                <span class="route-chip slm">Ollama SLM</span>
                <span class="route-chip llm">OpenAI API</span>
                <span class="route-chip safety">Claude API</span>
              </div>
            </div>
            <div class="prompt-chips" id="prompt-chips"></div>
            <label class="prompt-field">
              <span>Prompt</span>
              <textarea id="inbox-prompt" rows="5">Summarize the most important emails I need to respond to today.</textarea>
            </label>
            <div class="composer-actions">
              <button id="run-inbox" type="button">Run agents</button>
              <div class="composer-status" id="composer-status">Ready</div>
            </div>
          </section>

          <section class="run-summary" id="run-summary" aria-live="polite"></section>
          <section class="agent-results" id="agent-results" aria-label="Agent comparison results"></section>
          <section class="history-panel" aria-label="Prompt history">
            <div class="trace-head">
              <h2>History</h2>
              <p>Local session</p>
            </div>
            <div id="run-history" class="run-history"></div>
          </section>
        </aside>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
