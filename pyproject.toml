[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-agent-router"
version = "0.1.0"
description = "Small-model-first agent-step router"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pranayD21" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "playwright>=1.45",
]

[project.scripts]
slm-router = "slm_agent_router.cli:main"
slm-router-web = "slm_agent_router.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slm_agent_router = ["static/*"]
