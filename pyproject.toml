[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-agent-router"
version = "0.1.0"
description = "Small-model-first agent-step router"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pranayD21" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
slm-router = "slm_agent_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
